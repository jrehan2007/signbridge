services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/isl_translator
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      JWT_EXPIRES_IN: 7d
      ADMIN_NAME: ${ADMIN_NAME:-Portal Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@isl.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    volumes:
      - model-files:/app/server/uploads

volumes:
  mongo-data:
  model-files:
